<main class="stage">
  <section class="phone light " data-gradient="false">
    <div class="statusbar">
      <span>9:41</span>
      <span class="system-icons"><span class="signal-dot"></span><span class="signal-dot"></span><span class="signal-dot"></span><span>WiFi</span><span class="battery-icon"></span></span>
    </div>
    <button class="back" data-go="settings.html"><svg><use href="#i-back"></use></svg></button>
    

<div class="content no-nav top stack-14">
  <div>
    <h1 class="section-title">Earbud Controls</h1>
    <p class="subtitle">Choose what each right earbud gesture does.</p>
  </div>
  <div class="segmented"><a href="left-earbud-controls.html">Left</a><a class="active" href="right-earbud-controls.html">Right</a></div>
  <p class="subtitle" style="font-size:12px">The same action can only be assigned once for each ear.</p>
  <div class="control-card">
    <div class="control-row">
      <label>Single Tap</label>
      <select data-control-select="sw_right_single">
        <option>Play / Pause</option>
        <option>Noise Control</option>
        <option>Volume Up</option>
        <option>Voice Assistant</option>
      </select>
    </div>
    <div class="control-row">
      <label>Double Tap</label>
      <select data-control-select="sw_right_double">
        <option>Next Track</option>
        <option>Previous Track</option>
        <option>Play / Pause</option>
        <option>Off</option>
      </select>
    </div>
    <div class="control-row">
      <label>Long Press</label>
      <select data-control-select="sw_right_hold">
        <option>Noise Control</option>
        <option>Voice Assistant</option>
        <option>Volume Up</option>
        <option>Off</option>
      </select>
    </div>
  </div>
</div>

    
  </section>
</main>
